<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planes del grupo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d0f12;
    --surface: #161a20;
    --surface-2: #1d222a;
    --border: #262b33;
    --text: #e6e8eb;
    --muted: #8b939f;
    --accent: #5fd0c5;      /* hecho */
    --accent-amber: #ffb454; /* pendiente con fecha */
    --accent-gray: #5b6472;  /* sin fecha */
    --danger: #e8645a;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:28px 18px 60px;
  }
  .wrap{max-width:880px;margin:0 auto;}
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:6px;
    flex-wrap:wrap;
  }
  h1{
    font-family:'IBM Plex Mono',monospace;
    font-size:20px;
    font-weight:600;
    letter-spacing:-0.2px;
    margin:0;
  }
  h1 .dot{color:var(--accent);}
  .sub{
    color:var(--muted);
    font-size:13px;
    margin:0 0 22px;
  }
  .notice{
    font-size:12px;
    color:var(--muted);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:8px 12px;
    margin-bottom:22px;
    background:var(--surface);
  }

  /* add form */
  .add-form{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px;
    margin-bottom:24px;
  }
  .add-form input{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    padding:9px 10px;
    font-size:14px;
    font-family:inherit;
  }
  .add-form input::placeholder{color:var(--muted);}
  #f-name{flex:1 1 200px; min-width:160px;}
  #f-date{flex:0 0 150px;}
  #f-time{flex:0 0 100px;}
  #f-place{flex:0 0 150px;}
  #f-who{flex:0 0 150px;}
  .btn{
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    border-radius:8px;
    padding:9px 14px;
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .btn:hover{border-color:#3a414c;}
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#06231f;
    font-weight:600;
  }
  .btn-primary:hover{background:#74d9cf;}

  /* layout */
  .grid{
    display:grid;
    grid-template-columns: 1.5fr 1fr;
    gap:20px;
  }
  @media (max-width:680px){ .grid{grid-template-columns:1fr;} }

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
  }
  .panel h2{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
    margin:0 0 12px;
  }

  /* list */
  .group-label{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin:16px 0 8px;
  }
  .group-label:first-child{margin-top:0;}
  .plan-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 8px;
    border-radius:8px;
    border:1px solid transparent;
  }
  .plan-item:hover{background:var(--surface-2);}
  .plan-id{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--muted);
    width:34px;
    flex-shrink:0;
  }
  .status-dot{
    width:9px;height:9px;border-radius:50%;
    flex-shrink:0;
    background:var(--accent-gray);
  }
  .status-dot.has-date{background:var(--accent-amber);}
  .status-dot.done{background:var(--accent);}
  .plan-main{flex:1; min-width:0;}
  .plan-name{
    font-size:14px;
    line-height:1.3;
  }
  .plan-name.done{
    text-decoration:line-through;
    color:var(--muted);
  }
  .plan-meta{
    font-size:11.5px;
    color:var(--muted);
    margin-top:1px;
    font-family:'IBM Plex Mono',monospace;
  }
  .plan-actions{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .icon-btn{
    background:none;
    border:1px solid var(--border);
    color:var(--muted);
    width:26px;height:26px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s, color .15s;
  }
  .icon-btn:hover{color:var(--text); border-color:#3a414c;}
  .icon-btn.danger:hover{color:var(--danger); border-color:var(--danger);}
  input.date-inline{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:6px;
    color:var(--text);
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
    padding:3px 4px;
    width:108px;
  }
  .empty{
    color:var(--muted);
    font-size:13px;
    padding:14px 4px;
  }

  /* calendar */
  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .cal-month{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    text-transform:capitalize;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    text-align:center;
  }
  .cal-dow{
    font-size:10px;
    color:var(--muted);
    padding-bottom:4px;
  }
  .cal-day{
    position:relative;
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    border-radius:7px;
    cursor:pointer;
    color:var(--text);
  }
  .cal-day.empty-cell{cursor:default;}
  .cal-day:hover:not(.empty-cell){background:var(--surface-2);}
  .cal-day.today{border:1px solid var(--accent);}
  .cal-day.selected{background:var(--accent); color:#06231f; font-weight:600;}
  .cal-day .pip{
    position:absolute;
    bottom:3px;
    width:4px;height:4px;
    border-radius:50%;
    background:var(--accent-amber);
  }
  .cal-day.selected .pip{background:#06231f;}
  .filter-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:20px;
    padding:5px 10px;
    font-size:12px;
    margin-top:10px;
    font-family:'IBM Plex Mono',monospace;
    cursor:pointer;
  }

  .loading, .error{
    color:var(--muted);
    font-size:13px;
    padding:20px 4px;
  }
  .error{color:var(--danger);}

  /* who-bar + rsvp */
  .who-bar{margin-bottom:16px;}
  .who-bar input{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    padding:8px 10px;
    font-size:13px;
    font-family:inherit;
    width:100%;
    max-width:300px;
    transition:border-color .3s;
  }
  .who-bar input::placeholder{color:var(--muted);}
  .rsvp-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:5px;
    flex-wrap:wrap;
  }
  .rsvp-btn{
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--muted);
    border-radius:6px;
    padding:2px 8px;
    font-size:11px;
    cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
  }
  .rsvp-btn:hover{color:var(--text); border-color:#3a414c;}
  .rsvp-summary{
    font-size:11px;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot">●</span> Planes del grupo</h1>
  </header>
  <p class="sub">Lista colaborativa de planes con fecha. Cualquiera con este enlace puede añadir, editar o marcar como hecho.</p>
  <div class="notice">Pagina de prueba</div>

  <div class="who-bar">
    <input id="my-name" type="text" placeholder="Tu nombre (para marcar si vas o no a un plan)" maxlength="30">
  </div>

  <form class="add-form" id="add-form">
    <input id="f-name" type="text" placeholder="Nombre del plan" required maxlength="80">
    <input id="f-date" type="date">
    <input id="f-time" type="text" placeholder="Hora aprox" maxlength="20">
    <input id="f-place" type="text" placeholder="Lugar" maxlength="60">
    <input id="f-who" type="text" placeholder="Quién lo propone (opcional)" maxlength="40">
    <button class="btn btn-primary" type="submit">Añadir</button>
  </form>

  <div id="content">
    <div class="loading">Cargando planes…</div>
  </div>
</div>

<script>
// --- Configura esto con tus datos de Supabase (Project Settings > API) ---
const SUPABASE_URL = 'https://skicchnemhgugiarkbrk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_M8lX-2ckfcA_FiSk5cXNYA_ZuTyTNaE';
const TABLE = 'planes';
// ---------------------------------------------------------------------------

let plans = [];
let calOffset = 0; // months from current month
let selectedDate = null; // 'YYYY-MM-DD' or null

const DOW = ['L','M','X','J','V','S','D'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function sbHeaders(extra={}){
  return {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    'Content-Type': 'application/json',
    ...extra
  };
}

async function loadData(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*,asistencia(name,status)&order=created_at.asc`, {
      headers: sbHeaders()
    });
    if(!res.ok) throw new Error('fetch failed: ' + res.status);
    plans = await res.json();
  }catch(e){
    console.error('No se pudo cargar', e);
    document.getElementById('content').innerHTML = `<div class="error">No se pudo conectar con Supabase. Revisa SUPABASE_URL y SUPABASE_ANON_KEY en el código.</div>`;
    return;
  }
  renderAll();
}

function fmtDate(d){
  if(!d) return '';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}

function renderAll(){
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="grid">
      <div class="panel">
        <h2>Lista</h2>
        <div id="list-area"></div>
      </div>
      <div class="panel">
        <h2>Calendario</h2>
        <div id="cal-area"></div>
      </div>
    </div>
  `;
  renderList();
  renderCalendar();
}

function renderList(){
  const area = document.getElementById('list-area');
  let items = plans.map((p, i) => ({...p, _idx: i}));

  if(selectedDate){
    items = items.filter(p => p.date === selectedDate);
  }

  if(items.length === 0){
    area.innerHTML = selectedDate
      ? `<div class="empty">No hay planes para el ${fmtDate(selectedDate)}.</div>
         <div class="filter-chip" onclick="clearFilter()">✕ ${fmtDate(selectedDate)}</div>`
      : `<div class="empty">Sin planes todavía. Añade el primero arriba.</div>`;
    return;
  }

  const withDate = items.filter(p => p.date).sort((a,b) => a.date.localeCompare(b.date));
  const withoutDate = items.filter(p => !p.date);

  let html = '';
  if(selectedDate){
    html += `<div class="filter-chip" onclick="clearFilter()">✕ ${fmtDate(selectedDate)}</div>`;
  }
  if(withDate.length){
    html += `<div class="group-label">Con fecha</div>`;
    html += withDate.map(renderItem).join('');
  }
  if(withoutDate.length){
    html += `<div class="group-label">Sin fecha</div>`;
    html += withoutDate.map(renderItem).join('');
  }
  area.innerHTML = html;
}

function renderItem(p){
  const idx = p._idx;
  const num = String(idx+1).padStart(3,'0');
  const dotClass = p.status === 'hecho' ? 'done' : (p.date ? 'has-date' : '');
  const metaParts = [];
  if(p.date) metaParts.push(fmtDate(p.date));
  if(p.time) metaParts.push(p.time);
  if(p.place) metaParts.push(p.place);
  if(p.who) metaParts.push(p.who);
  return `
    <div class="plan-item">
      <div class="plan-id">#${num}</div>
      <div class="status-dot ${dotClass}"></div>
      <div class="plan-main">
        <div class="plan-name ${p.status==='hecho'?'done':''}">${escapeHtml(p.name)}</div>
        ${metaParts.length ? `<div class="plan-meta">${metaParts.map(escapeHtml).join(' · ')}</div>` : ''}
        <div class="rsvp-row">
          <button class="rsvp-btn" onclick="setRSVP('${p.id}', true)">✅ Voy</button>
          <button class="rsvp-btn" onclick="setRSVP('${p.id}', false)">❌ No voy</button>
          <span class="rsvp-summary">${rsvpSummary(p.asistencia)}</span>
        </div>
      </div>
      <div class="plan-actions">
        <input type="date" class="date-inline" value="${p.date||''}" onchange="setDate('${p.id}', this.value)" title="Cambiar fecha">
        <button class="icon-btn" onclick="toggleStatus('${p.id}')" title="${p.status==='hecho'?'Marcar pendiente':'Marcar hecho'}">${p.status==='hecho'?'↺':'✓'}</button>
        <button class="icon-btn danger" onclick="deletePlan('${p.id}')" title="Eliminar">✕</button>
      </div>
    </div>
  `;
}

function rsvpSummary(asistencia){
  if(!asistencia || asistencia.length === 0) return '';
  const van = asistencia.filter(a => a.status === 'va').map(a => escapeHtml(a.name));
  const noVan = asistencia.filter(a => a.status === 'no_va').map(a => escapeHtml(a.name));
  const parts = [];
  if(van.length) parts.push(`✅ ${van.join(', ')}`);
  if(noVan.length) parts.push(`❌ ${noVan.join(', ')}`);
  return parts.join('&nbsp;&nbsp;');
}

async function setRSVP(planId, going){
  const nameInput = document.getElementById('my-name');
  const name = nameInput.value.trim();
  if(!name){
    nameInput.focus();
    nameInput.style.borderColor = 'var(--danger)';
    setTimeout(() => { nameInput.style.borderColor = ''; }, 1500);
    return;
  }
  const status = going ? 'va' : 'no_va';
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/asistencia?on_conflict=plan_id,name`, {
      method: 'POST',
      headers: sbHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),
      body: JSON.stringify([{ plan_id: planId, name, status }])
    });
  }catch(e){ console.error('No se pudo guardar la asistencia', e); }
  await loadData();
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderCalendar(){
  const area = document.getElementById('cal-area');
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth() + calOffset, 1);
  const year = base.getFullYear();
  const month = base.getMonth();

  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // Monday=0
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

  const datesWithPlans = new Set(plans.filter(p=>p.date).map(p=>p.date));

  let cells = '';
  for(let i=0;i<firstDow;i++){
    cells += `<div class="cal-day empty-cell"></div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === selectedDate;
    const hasPlan = datesWithPlans.has(dateStr);
    cells += `<div class="cal-day ${isToday?'today':''} ${isSelected?'selected':''}" onclick="selectDate('${dateStr}')">${d}${hasPlan?'<span class="pip"></span>':''}</div>`;
  }

  area.innerHTML = `
    <div class="cal-nav">
      <button class="icon-btn" onclick="navMonth(-1)">‹</button>
      <div class="cal-month">${MONTHS[month]} ${year}</div>
      <button class="icon-btn" onclick="navMonth(1)">›</button>
    </div>
    <div class="cal-grid">
      ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
  `;
}

function navMonth(delta){
  calOffset += delta;
  renderCalendar();
}

function selectDate(dateStr){
  selectedDate = (selectedDate === dateStr) ? null : dateStr;
  renderCalendar();
  renderList();
}

function clearFilter(){
  selectedDate = null;
  renderCalendar();
  renderList();
}

async function toggleStatus(id){
  const p = plans.find(x => x.id === id);
  if(!p) return;
  const newStatus = p.status === 'hecho' ? 'pendiente' : 'hecho';
  p.status = newStatus;
  renderList();
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${id}`, {
      method: 'PATCH',
      headers: sbHeaders({'Prefer':'return=minimal'}),
      body: JSON.stringify({ status: newStatus })
    });
  }catch(e){ console.error('No se pudo guardar', e); }
}

async function deletePlan(id){
  plans = plans.filter(x => x.id !== id);
  renderAll();
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${id}`, {
      method: 'DELETE',
      headers: sbHeaders({'Prefer':'return=minimal'})
    });
  }catch(e){ console.error('No se pudo borrar', e); }
}

async function setDate(id, value){
  const p = plans.find(x => x.id === id);
  if(!p) return;
  p.date = value || null;
  renderAll();
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${id}`, {
      method: 'PATCH',
      headers: sbHeaders({'Prefer':'return=minimal'}),
      body: JSON.stringify({ date: value || null })
    });
  }catch(e){ console.error('No se pudo guardar', e); }
}

document.getElementById('add-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('f-name').value.trim();
  const date = document.getElementById('f-date').value;
  const time = document.getElementById('f-time').value.trim();
  const place = document.getElementById('f-place').value.trim();
  const who = document.getElementById('f-who').value.trim();
  if(!name) return;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
      method: 'POST',
      headers: sbHeaders({'Prefer':'return=representation'}),
      body: JSON.stringify([{ name, date: date || null, time: time || null, place: place || null, who: who || null, status: 'pendiente' }])
    });
    const [newPlan] = await res.json();
    newPlan.asistencia = [];
    plans.push(newPlan);
  }catch(err){
    console.error('No se pudo añadir', err);
  }
  document.getElementById('f-name').value = '';
  document.getElementById('f-date').value = '';
  document.getElementById('f-time').value = '';
  document.getElementById('f-place').value = '';
  document.getElementById('f-who').value = '';
  renderAll();
});

loadData();
</script>
</body>
</html>
