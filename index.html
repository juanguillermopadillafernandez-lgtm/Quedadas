<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planes del grupo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Variables de diseño por defecto (Modo Oscuro Premium) */
  :root {
    --bg: #0b0d10;
    --surface: #13161b;
    --surface-2: #1b1f26;
    --border: #232932;
    --text: #f0f2f5;
    --muted: #8692a3;
    --accent: #4ade80;       /* hecho - verde vibrante */
    --accent-amber: #f59e0b; /* pendiente con fecha - ámbar */
    --accent-gray: #64748b;  /* sin fecha */
    --danger: #ef4444;
    --radius: 12px;
    --input-bg: #1b1f26;
    --shadow: rgba(0, 0, 0, 0.3);
  }

  /* Variables para Modo Claro Elegante */
  [data-theme="light"] {
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-2: #f1f5f9;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #10b981;       
    --accent-amber: #f59e0b; 
    --accent-gray: #94a3b8;  
    --danger: #ef4444;
    --input-bg: #ffffff;
    --shadow: rgba(15, 23, 42, 0.05);
  }

  *{
    box-sizing: border-box;
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  
  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 32px 18px 60px;
    -webkit-font-smoothing: antialiased;
  }
  
  .wrap{ max-width: 900px; margin: 0 auto; position: relative; }
  
  header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 8px;
    flex-wrap: wrap;
    padding-right: 60px;
  }
  
  h1{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin: 0;
  }
  h1 .dot{ color: var(--accent-amber); }
  
  .sub{
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 24px;
    line-height: 1.5;
  }
  
  .notice{
    font-size: 13px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 24px;
    background: var(--surface);
    box-shadow: 0 2px 8px var(--shadow);
  }

  /* Botón Cambiar Tema */
  .theme-toggle {
    position: absolute;
    top: 0;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    box-shadow: 0 4px 12px var(--shadow);
    z-index: 10;
  }
  .theme-toggle:hover {
    border-color: var(--muted);
  }

  /* Formulario Estilizado */
  .add-form{
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 32px;
    box-shadow: 0 4px 12px var(--shadow);
  }
  
  .add-form input{
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .add-form input:focus {
    border-color: var(--muted);
  }
  .add-form input::placeholder{ color: var(--muted); }
  
  #f-name { flex: 2 1 240px; min-width: 180px; }
  #f-date { flex: 1 1 140px; }
  #f-time { flex: 1 1 100px; }
  #f-place{ flex: 1 1 140px; }
  #f-who  { flex: 1 1 140px; }
  
  .btn{
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover{ background: var(--border); }
  .btn-primary{
    background: var(--text);
    border-color: var(--text);
    color: var(--bg);
  }
  .btn-primary:hover{
    opacity: 0.9;
    background: var(--text);
  }

  /* Layout de la App */
  .grid{
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 24px;
  }
  @media (max-width: 768px){ .grid{ grid-template-columns: 1fr; } }

  .panel{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 4px 12px var(--shadow);
  }
  .panel h2{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
    margin: 0 0 16px;
    font-weight: 600;
  }

  /* Lista de Tarjetas */
  .group-label{
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin: 24px 0 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
  }
  .group-label:first-child{ margin-top: 0; }
  
  .plan-item{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    margin-bottom: 8px;
  }
  .plan-item:hover{
    background: var(--surface-2);
    border-color: var(--muted);
  }
  .plan-id{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    width: 32px;
    flex-shrink: 0;
  }
  .status-dot{
    width: 10px; height: 10px; border-radius: 50%;
    flex-shrink: 0;
    background: var(--accent-gray);
  }
  .status-dot.has-date{ background: var(--accent-amber); }
  .status-dot.done{ background: var(--accent); }
  
  .plan-main{ flex: 1; min-width: 0; }
  .plan-name{
    font-size: 15px;
    font-weight: 500;
    line-height: 1.4;
  }
  .plan-name.done{
    text-decoration: line-through;
    color: var(--muted);
  }
  .plan-meta{
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
    font-family: 'IBM Plex Mono', monospace;
  }
  
  .plan-actions{
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    align-items: center;
  }
  
  .icon-btn{
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 28px; height: 28px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover{ color: var(--text); border-color: var(--muted); background: var(--surface-2); }
  .icon-btn.danger:hover{ color: var(--danger); border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }
  
  input.date-inline{
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    padding: 4px 6px;
    width: 118px;
    outline: none;
  }
  
  .empty, .loading, .error{
    color: var(--muted);
    font-size: 14px;
    padding: 24px 4px;
    text-align: center;
  }
  .error{ color: var(--danger); }

  /* Módulo Calendario */
  .cal-nav{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-month{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .cal-grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    text-align: center;
  }
  .cal-dow{
    font-size: 11px;
    color: var(--muted);
    padding-bottom: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
  }
  .cal-day{
    position: relative;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text);
    background: var(--surface-2);
  }
  .cal-day.empty-cell{ cursor: default; background: transparent; }
  .cal-day:hover:not(.empty-cell){ background: var(--border); }
  .cal-day.today{ border: 1px solid var(--accent-amber); color: var(--accent-amber); }
  .cal-day.selected{ background: var(--text); color: var(--bg); font-weight: 600; }
  
  .cal-day .pip{
    position: absolute;
    bottom: 4px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent-amber);
  }
  .cal-day.selected .pip{ background: var(--bg); }
  
  .filter-chip{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 12px;
    margin-top: 12px;
    font-family: 'IBM Plex Mono', monospace;
    cursor: pointer;
    font-weight: 500;
  }
  .filter-chip:hover { border-color: var(--muted); }

  /* Identificación */
  .who-bar{ margin-bottom: 20px; }
  .who-bar input{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    width: 100%;
    max-width: 320px;
    outline: none;
    box-shadow: 0 2px 6px var(--shadow);
  }
  .who-bar input:focus { border-color: var(--muted); }
  
  /* Bloque RSVP */
  .rsvp-row{
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    flex-wrap: wrap;
  }
  .rsvp-btn{
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
  }
  .rsvp-btn:hover{ border-color: var(--muted); background: var(--border); }
  .rsvp-summary{
    font-size: 12px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    margin-left: 4px;
  }
</style>
</head>
<body>
<div class="wrap">
  <button class="theme-toggle" id="theme-btn" title="Cambiar tema">🌓</button>

  <header>
    <h1><span class="dot">●</span> Planes del grupo</h1>
  </header>
  <p class="sub">Lista colaborativa de planes con fecha. Cualquiera con este enlace puede añadir, editar o marcar como hecho.</p>
  <div class="notice">Esto se guarda en una tabla de Supabase de manera pública y en tiempo real.</div>

  <div class="who-bar">
    <input id="my-name" type="text" placeholder="Tu nombre para apuntarte a los planes..." maxlength="30">
  </div>

  <form class="add-form" id="add-form">
    <input id="f-name" type="text" placeholder="Nombre del plan" required maxlength="80">
    <input id="f-date" type="date">
    <input id="f-time" type="text" placeholder="Hora aprox" maxlength="20">
    <input id="f-place" type="text" placeholder="Lugar" maxlength="60">
    <input id="f-who" type="text" placeholder="Quién propone" maxlength="40">
    <button class="btn btn-primary" type="submit">Añadir</button>
  </form>

  <div id="content">
    <div class="loading">Cargando la lista de planes…</div>
  </div>
</div>

<script>
// --- Configuración de Supabase ---
const SUPABASE_URL = 'https://skicchnemhgugiarkbrk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_M8lX-2ckfcA_FiSk5cXNYA_ZuTyTNaE';
const TABLE = 'planes';
// ----------------------------------

let plans = [];
let calOffset = 0; 
let selectedDate = null; 

const DOW = ['L','M','X','J','V','S','D'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

// --- Inicialización y Guardado Persistente del Tema ---
const themeBtn = document.getElementById('theme-btn');
const currentTheme = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', currentTheme);

themeBtn.addEventListener('click', () => {
  let theme = document.documentElement.getAttribute('data-theme');
  let newTheme = theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
});

function sbHeaders(extra={}){
  return {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    'Content-Type': 'application/json',
    ...extra
  };
}

// SOLUCIÓN TOTAL: Si falla la relación o tabla externa, se bifurca inmediatamente sin lanzar excepciones catastróficas
async function loadData(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*,asistencia(name,status)&order=created_at.asc`, {
      headers: sbHeaders()
    });
    if(!res.ok) throw new Error('Primary query failed status: ' + res.status);
    plans = await res.json();
  }catch(e){
    console.warn('Falló la consulta relacional con la tabla asistencia, aplicando fallback seguro inmediato:', e);
    try {
      const resFallback = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=created_at.asc`, {
        headers: sbHeaders()
      });
      if(!resFallback.ok) throw new Error('Fallback endpoint unreachable');
      plans = await resFallback.json();
    } catch(err) {
      document.getElementById('content').innerHTML = `<div class="error">Error crítico: No se ha podido obtener conexión con las tablas de Supabase.</div>`;
      return;
    }
  }
  renderAll();
}

function fmtDate(d){
  if(!d) return '';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}

function renderAll(){
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="grid">
      <div class="panel">
        <h2>Lista de planes</h2>
        <div id="list-area"></div>
      </div>
      <div class="panel">
        <h2>Calendario</h2>
        <div id="cal-area"></div>
      </div>
    </div>
  `;
  renderList();
  renderCalendar();
}

function renderList(){
  const area = document.getElementById('list-area');
  let items = plans.map((p, i) => ({...p, _idx: i}));

  if(selectedDate){
    items = items.filter(p => p.date === selectedDate);
  }

  if(items.length === 0){
    area.innerHTML = selectedDate
      ? `<div class="empty">No hay planes organizados para el ${fmtDate(selectedDate)}.</div>
         <div class="filter-chip" onclick="clearFilter()">✕ Quitar filtro (${fmtDate(selectedDate)})</div>`
      : `<div class="empty">No hay ningún plan propuesto todavía. ¡Escribe uno arriba!</div>`;
    return;
  }

  const withDate = items.filter(p => p.date).sort((a,b) => a.date.localeCompare(b.date));
  const withoutDate = items.filter(p => !p.date);

  let html = '';
  if(selectedDate){
    html += `<div class="filter-chip" onclick="clearFilter()">✕ Quitar filtro (${fmtDate(selectedDate)})</div>`;
  }
  if(withDate.length){
    html += `<div class="group-label">Planes fechados</div>`;
    html += withDate.map(renderItem).join('');
  }
  if(withoutDate.length){
    html += `<div class="group-label">Planes en el aire (Sin fecha)</div>`;
    html += withoutDate.map(renderItem).join('');
  }
  area.innerHTML = html;
}

function renderItem(p){
  const idx = p._idx;
  const num = String(idx+1).padStart(3,'0');
  const dotClass = p.status === 'hecho' ? 'done' : (p.date ? 'has-date' : '');
  const metaParts = [];
  if(p.date) metaParts.push(fmtDate(p.date));
  if(p.time) metaParts.push(p.time);
  if(p.place) metaParts.push(p.place);
  if(p.who) metaParts.push(`Por: ${p.who}`);
  return `
    <div class="plan-item">
      <div class="plan-id">#${num}</div>
      <div class="status-dot ${dotClass}"></div>
      <div class="plan-main">
        <div class="plan-name ${p.status==='hecho'?'done':''}">${escapeHtml(p.name)}</div>
        ${metaParts.length ? `<div class="plan-meta">${metaParts.map(escapeHtml).join(' · ')}</div>` : ''}
        <div class="rsvp-row">
          <button class="rsvp-btn" onclick="setRSVP('${p.id}', true)">✅ Voy</button>
          <button class="rsvp-btn" onclick="setRSVP('${p.id}', false)">❌ No voy</button>
          <span class="rsvp-summary">${rsvpSummary(p.asistencia)}</span>
        </div>
      </div>
      <div class="plan-actions">
        <input type="date" class="date-inline" value="${p.date||''}" onchange="setDate('${p.id}', this.value)" title="Asignar fecha">
        <button class="icon-btn" onclick="toggleStatus('${p.id}')" title="${p.status==='hecho'?'Pendiente':'Hecho'}">${p.status==='hecho'?'↺':'✓'}</button>
        <button class="icon-btn danger" onclick="deletePlan('${p.id}')" title="Eliminar">✕</button>
      </div>
    </div>
  `;
}

function rsvpSummary(asistencia){
  if(!asistencia || asistencia.length === 0) return '';
  const van = asistencia.filter(a => a.status === 'va').map(a => escapeHtml(a.name));
  const noVan = asistencia.filter(a => a.status === 'no_va').map(a => escapeHtml(a.name));
  const parts = [];
  if(van.length) parts.push(`👍 ${van.join(', ')}`);
  if(noVan.length) parts.push(`👎 ${noVan.join(', ')}`);
  return parts.join('&nbsp;&nbsp;');
}

async function setRSVP(planId, going){
  const nameInput = document.getElementById('my-name');
  const name = nameInput.value.trim();
  if(!name){
    nameInput.focus();
    nameInput.style.borderColor = 'var(--danger)';
    setTimeout(() => { nameInput.style.borderColor = ''; }, 1500);
    return;
  }
  const status = going ? 'va' : 'no_va';
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/asistencia?on_conflict=plan_id,name`, {
      method: 'POST',
      headers: sbHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),
      body: JSON.stringify([{ plan_id: planId, name, status }])
    });
  }catch(e){ console.error('Error al guardar asistencia', e); }
  await loadData();
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderCalendar(){
  const area = document.getElementById('cal-area');
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth() + calOffset, 1);
  const year = base.getFullYear();
  const month = base.getMonth();

  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; 
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

  const datesWithPlans = new Set(plans.filter(p=>p.date).map(p=>p.date));

  let cells = '';
  for(let i=0;i<firstDow;i++){
    cells += `<div class="cal-day empty-cell"></div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === selectedDate;
    const hasPlan = datesWithPlans.has(dateStr);
    cells += `<div class="cal-day ${isToday?'today':''} ${isSelected?'selected':''}" onclick="selectDate('${dateStr}')">${d}${hasPlan?'<span class="pip"></span>':''}</div>`;
  }

  area.innerHTML = `
    <div class="cal-nav">
      <button class="icon-btn" onclick="navMonth(-1)">‹</button>
      <div class="cal-month">${MONTHS[month]} ${year}</div>
      <button class="icon-btn" onclick="navMonth(1)">›</button>
    </div>
    <div class="cal-grid">
      ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
  `;
}

function navMonth(delta){
  calOffset += delta;
  renderCalendar();
}

function selectDate(dateStr){
  selectedDate = (selectedDate === dateStr) ? null : dateStr;
  renderCalendar();
  renderList();
}

function clearFilter(){
  selectedDate = null;
  renderCalendar();
  renderList();
}

async function toggleStatus(id){
  const p = plans.find(x => x.id === id);
  if(!p) return;
  const newStatus = p.status === 'hecho' ? 'pendiente' : 'hecho';
  p.status = newStatus;
  renderList();
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${id}`, {
      method: 'PATCH',
      headers: sbHeaders({'Prefer':'return=minimal'}),
      body: JSON.stringify({ status: newStatus })
    });
  }catch(e){ console.error('Error al actualizar estado', e); }
}

async function deletePlan(id){
  plans = plans.filter(x => x.id !== id);
  renderAll();
  try{
